services:
  # VPN gateway. Official Gluetun image (upstream: github.com/passteque/gluetun,
  # also published as qmcgaw/gluetun and ghcr.io/qdm12/gluetun). Pinned to the
  # 2026-09-26 multi-arch index digest (commit ded7fd0), which includes the
  # NAT-PMP client fix to retry transient "connection refused" renewals
  # instead of tearing down the forwarded port (gluetun #3462, fixed by
  # #3464). Bump the digest deliberately when upgrading.
  # Negotiates the ProtonVPN NAT-PMP forwarded port and publishes it on its
  # control server (:8001, loopback-only inside the shared network namespace).
  gluetun:
    image: qmcgaw/gluetun@sha256:2733bb22b27e3efa7a9f2cef9057ec12791b8b225793fcd3dbfd0508404dfc25
    container_name: miniace-gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WG_PRIVATE_KEY}
      - SERVER_COUNTRIES=${PROTON_COUNTRIES:-Netherlands}
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      - PORT_FORWARD_ONLY=on
      - HTTP_CONTROL_SERVER_ADDRESS=:8001
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"none"}
      - HEALTH_TARGET_ADDRESSES=cloudflare.com:80
      - FIREWALL_INPUT_PORTS=6878,8080
      - FIREWALL_OUTBOUND_SUBNETS=${DOCKER_SUBNET:-172.30.0.0/24}
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - ./data/gluetun:/tmp/gluetun
    ports:
      - "${ACESTREAM_HTTP_PORT:-6878}:6878"
      - "${PLAYLISTS_PORT:-8080}:8080"
    restart: unless-stopped

  # AceStream engine + Gluetun port supervision + IPNS playlist sync.
  # The only custom image in the stack; shares gluetun's network namespace
  # so the engine binds exactly the P2P port announced by ProtonVPN.
  acestream:
    build:
      context: ./images/acestream
    image: ghcr.io/biquinisdonrodrigo/miniace:latest
    container_name: miniace-acestream
    init: true
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - TZ=${TZ:-Europe/Madrid}
      - PUBLIC_PORT=${ACESTREAM_HTTP_PORT:-6878}
      - IPFS_GATEWAY=${IPFS_GATEWAY:-http://kubo:48080}
      - IPFS_FALLBACK_GATEWAYS=${IPFS_FALLBACK_GATEWAYS:-https://ipfs.filebase.io,https://ipfs.io,https://dweb.link,https://w3s.link}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-3600}
      - ACESTREAM_CACHE_LIMIT_GB=${ACESTREAM_CACHE_LIMIT_GB:-5}
      - ACESTREAM_MAX_CONNECTIONS=${ACESTREAM_MAX_CONNECTIONS:-2000}
      - ACESTREAM_MAX_PEERS_LIMIT=${ACESTREAM_MAX_PEERS_LIMIT:-500}
      - ACESTREAM_STARTUP_MAX_PEERS=${ACESTREAM_STARTUP_MAX_PEERS:-100}
      - ACESTREAM_STARTUP_UPLOAD_SLOTS=${ACESTREAM_STARTUP_UPLOAD_SLOTS:-50}
      - ACESTREAM_SLOTS_MANAGER_USE_CPU_LIMIT=${ACESTREAM_SLOTS_MANAGER_USE_CPU_LIMIT:-0}
      - ACESTREAM_UPLOAD_LIMIT=${ACESTREAM_UPLOAD_LIMIT:-0}
      - ACESTREAM_DOWNLOAD_LIMIT=${ACESTREAM_DOWNLOAD_LIMIT:-0}
      - ACESTREAM_MAX_UPLOAD_SLOTS=${ACESTREAM_MAX_UPLOAD_SLOTS:-}
      - ACESTREAM_MIN_UPLOAD_SLOTS=${ACESTREAM_MIN_UPLOAD_SLOTS:-}
      - ACESTREAM_FIX_UPLOAD_SLOTS=${ACESTREAM_FIX_UPLOAD_SLOTS:-1}
      - ACESTREAM_MAX_TIMESHIFT_PEERS=${ACESTREAM_MAX_TIMESHIFT_PEERS:-}
      - ACESTREAM_SLOTS_MANAGER_MIN_SLOTS=${ACESTREAM_SLOTS_MANAGER_MIN_SLOTS:-}
      - ACESTREAM_SLOTS_MANAGER_CPU_LOW_LIMIT=${ACESTREAM_SLOTS_MANAGER_CPU_LOW_LIMIT:-}
      - ACESTREAM_SLOTS_MANAGER_CPU_HIGH_LIMIT=${ACESTREAM_SLOTS_MANAGER_CPU_HIGH_LIMIT:-}
      - ACESTREAM_SLOTS_MANAGER_CPU_LOW_LIMIT_PER_CORE=${ACESTREAM_SLOTS_MANAGER_CPU_LOW_LIMIT_PER_CORE:-}
      - ACESTREAM_SLOTS_MANAGER_CPU_HIGH_LIMIT_PER_CORE=${ACESTREAM_SLOTS_MANAGER_CPU_HIGH_LIMIT_PER_CORE:-}
      - ACESTREAM_SLOTS_MANAGER_BASE_BITRATE=${ACESTREAM_SLOTS_MANAGER_BASE_BITRATE:-}
      - ACESTREAM_WANTED_SLOTS_FACTOR=${ACESTREAM_WANTED_SLOTS_FACTOR:-}
      - ACESTREAM_STARTUP_SLOTS_FACTOR=${ACESTREAM_STARTUP_SLOTS_FACTOR:-}
      - ACESTREAM_FIX_UPLOAD_SLOTS_INTERVAL=${ACESTREAM_FIX_UPLOAD_SLOTS_INTERVAL:-}
      - ACESTREAM_LIVE_CACHE_TYPE=${ACESTREAM_LIVE_CACHE_TYPE:-auto}
      - ACESTREAM_VOD_CACHE_TYPE=${ACESTREAM_VOD_CACHE_TYPE:-auto}
      - ACESTREAM_LIVE_MEM_CACHE_SIZE=${ACESTREAM_LIVE_MEM_CACHE_SIZE:-}
      - ACESTREAM_LIVE_DISK_CACHE_SIZE=${ACESTREAM_LIVE_DISK_CACHE_SIZE:-}
      - ACESTREAM_MEMORY_CACHE_LIMIT=${ACESTREAM_MEMORY_CACHE_LIMIT:-}
      - ACESTREAM_VOD_BUFFER=${ACESTREAM_VOD_BUFFER:-30}
      - ACESTREAM_LOG_STDOUT_LEVEL=${ACESTREAM_LOG_STDOUT_LEVEL:-info}
      - ACESTREAM_LOG_MAX_SIZE=${ACESTREAM_LOG_MAX_SIZE:-10485760}
      - ACESTREAM_LOG_BACKUP_COUNT=${ACESTREAM_LOG_BACKUP_COUNT:-1}
      - ACESTREAM_VERBOSE_MODULES=${ACESTREAM_VERBOSE_MODULES:-}
      - ACESTREAM_EXTRA_FLAGS=${ACESTREAM_EXTRA_FLAGS:-}
      - PORT_WATCH_INTERVAL_S=${PORT_WATCH_INTERVAL_S:-10}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./data:/data
      - ./data/gluetun:/tmp/gluetun
      - ./data/acestream:/acestream
    restart: unless-stopped

  # Local IPFS node. Official Kubo image; resolves the IPNS playlists.
  # The only addition is a one-line /container-init.d script that moves the
  # HTTP gateway to 0.0.0.0:48080 so the acestream container can reach it.
  kubo:
    image: ipfs/kubo:v0.43.0
    container_name: miniace-kubo
    environment:
      - IPFS_PROFILE=server
    volumes:
      - ./data/ipfs:/data/ipfs
      - ./kubo/001-gateway-port.sh:/container-init.d/001-gateway-port.sh:ro
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.0.0/24}
